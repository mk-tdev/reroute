<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#e8f0e4" />
    <meta name="description" content="A small adventure for real life. Choose a path, find a detour when plans change, come back after a break, and grow an island at your own pace." />
    <title>ReRoute · A little world of possibility</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='20' fill='%233b6651'/%3E%3Cpath d='M10 28c20 0-9-16 20-16' fill='none' stroke='%23f3eacb' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="world">
      <header>
        <a class="wordmark" href="#" data-i18n-aria="app.home" aria-label="ReRoute home"
          ><svg viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="16" /><path d="M10 25c22 0-11-15 16-15m-5-3 5 3-4 5" /></svg>ReRoute</a
        >
        <div class="top-actions">
          <button class="round" id="sound" aria-label="Turn sound on" aria-pressed="false"></button>
          <button class="round" id="menu" data-i18n-aria="menu.open" aria-label="Open island menu"></button>
        </div>
      </header>
      <section class="welcome" aria-label="Welcome">
        <div class="chapter" id="chapter">YOUR OWN LITTLE WORLD</div>
        <h1 id="greeting">There’s a way for you.</h1>
        <p id="subtitle">A small step. A little discovery. Your pace.</p>
      </section>
      <main id="map" data-i18n-aria="app.island" aria-label="Interactive island">
        <div class="world-halo"></div>
        <svg id="island" viewBox="100 150 600 570" role="group" tabindex="0" data-i18n-aria="app.islandAria" aria-label="Explore your island. Drag to pan, pinch to zoom, or use arrow keys and plus and minus."></svg>
        <div class="camera-controls" role="group" data-i18n-aria="camera.group" aria-label="Island camera">
          <button id="camera-out" data-i18n-aria="camera.out" aria-label="Zoom out">−</button>
          <button id="camera-in" data-i18n-aria="camera.in" aria-label="Zoom in">+</button>
          <span></span>
          <button id="camera-follow" aria-label="Camera following your character" aria-pressed="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5" /><path d="M12 2v4m0 12v4M2 12h4m12 0h4" /></svg>
          </button>
          <button id="camera-home" data-i18n-aria="camera.home" aria-label="Show whole island">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5" /></svg>
          </button>
        </div>
        <p class="gesture-hint" data-i18n="app.gesture">Drag to wander <span>·</span> Pinch to look closer</p>
        <div class="compass" aria-hidden="true">
          <span>N</span
          ><svg viewBox="0 0 40 40"><path d="m20 2 5 13 13 5-13 5-5 13-5-13-13-5 13-5Z" /><path d="M20 7v26M7 20h26" /></svg>
        </div>
        <div class="scene-caption" aria-hidden="true" data-i18n="app.caption">SOMEWHERE GOOD <span>⌁</span> EST. TODAY</div>
      </main>
      <div class="bottom-ui">
        <p class="map-hint" id="hint"><span class="hint-dot"></span>Tap a glowing path. See where it takes you.</p>
        <button class="ribbon" id="ribbon" type="button"></button>
        <div class="dock">
          <button id="journey"><span class="dock-icon" id="journey-icon"></span><span data-i18n="dock.journey">My journey</span></button>
          <span class="dock-divider"></span>
          <button id="rest"><span class="dock-icon" id="moon-icon"></span><span data-i18n="dock.rest">A moment to rest</span></button>
        </div>
        <div class="prototype-label" data-i18n="app.prototype">AN INTERACTIVE LITTLE EXPERIMENT</div>
      </div>
      <div id="sparkles" aria-hidden="true"></div>
    </div>
    <dialog id="sheet" aria-labelledby="sheet-title">
      <div class="handle"></div>
      <button id="close" class="sheet-close" data-i18n-aria="app.close" aria-label="Close">×</button>
      <div id="sheet-content"></div>
    </dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <script src="camera.js"></script>
    <script src="motion.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
